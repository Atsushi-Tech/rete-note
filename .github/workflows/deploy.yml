name: Build and deploy

on:
  push:
    branches: [main]
  # 毎朝6:20（日本時間）に Claude の定期タスクがこのワークフローを起動し、その日付の予約記事を公開する。
  # 下の schedule は予備（GitHub の定時実行は遅れたり飛ばされたりするため）。何度動いても害はない。
  schedule:
    - cron: "17 21 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          TZ: Asia/Tokyo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
